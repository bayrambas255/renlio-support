<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#E85D2A" />
  <title>Renlio · Support</title>
  <script>
    const lang = (navigator.language || 'en').toLowerCase().split('-')[0];
    const target = lang === 'tr' ? 'tr/' : 'en/';
    window.location.replace(target);
  </script>
  <style>
    body { font-family: -apple-system, sans-serif; text-align: center; padding: 60px 20px; background: #FBF1ED; color: #522514; }
    a { color: #D9604F; text-decoration: none; font-weight: 600; }
    .langs { margin-top: 20px; display: flex; gap: 20px; justify-content: center; }
  </style>
</head>
<body>
  <h1>Renlio Support</h1>
  <p>Redirecting…</p>
  <div class="langs">
    <a href="tr/">Türkçe →</a>
    <a href="en/">English →</a>
  </div>
</body>
</html>
